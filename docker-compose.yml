version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: kindergarten-db
    environment:
      POSTGRES_DB: kindergarten
      POSTGRES_USER: kindergarten
      POSTGRES_PASSWORD: kindergarten
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres
      -c listen_addresses=*
      -c log_statement=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindergarten -d kindergarten"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: